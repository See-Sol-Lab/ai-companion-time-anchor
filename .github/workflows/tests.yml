name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  regression:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10"

      - name: Run time-expression regression tests
        run: python tests/test_time_expression.py

      - name: Run hook input regression tests
        run: python tests/test_stdin_bom.py

      - name: Run coding-project behaviour tests
        run: python tests/test_code_context.py

      - name: Run Codex installer regression tests
        run: python tests/test_codex_installer.py
